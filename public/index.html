<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Echo Arena</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="menu" class="panel">
        <div>
          <p class="eyebrow">Real-time duel prototype</p>
          <h1>Echo Arena</h1>
          <p class="lede">Fight your opponent while echoes of your last moves return to the arena.</p>
        </div>
        <div class="mode-select">
          <button type="button" id="pvpModeBtn" class="mode-btn active">Player vs Player</button>
          <button type="button" id="aiModeBtn" class="mode-btn">Player vs Computer</button>
        </div>

        <div id="pvpSection" class="actions">
          <button id="createBtn">Create Room</button>
          <form id="joinForm">
            <input id="roomInput" maxlength="5" placeholder="ROOM CODE" autocomplete="off" />
            <button type="submit">Join Room</button>
          </form>
        </div>

        <div id="aiSection" class="ai-actions hidden">
          <div class="difficulty-picker">
            <span class="diff-label">Difficulty:</span>
            <div class="diff-buttons">
              <button type="button" class="diff-btn" data-difficulty="easy">Easy</button>
              <button type="button" class="diff-btn active" data-difficulty="medium">Medium</button>
              <button type="button" class="diff-btn" data-difficulty="hard">Hard</button>
            </div>
          </div>
          <button id="startAiBtn" class="start-ai-btn">Fight Computer</button>
        </div>
        <div class="guide">
          <span>Move: A/D or arrows</span>
          <span>Jump: W/Up/Space</span>
          <span>Punch: J</span>
          <span>Kick: K</span>
          <span>Block: L/Shift</span>
        </div>
      </section>

      <section id="game" class="game hidden">
        <div class="hud">
          <div class="bar left"><span id="p1Name">Player 1</span><i id="p1Hp"></i></div>
          <div class="center">
            <strong id="timer">80</strong>
            <span id="echoTimer">Echo in 17s</span>
          </div>
          <div class="bar right"><span id="p2Name">Player 2</span><i id="p2Hp"></i></div>
        </div>
        <canvas id="arena" width="960" height="540"></canvas>
        <div id="banner" class="banner hidden"></div>
        <div class="room-card">
          <span>Room</span>
          <button id="copyCode" title="Copy room code">-----</button>
          <small id="status">Waiting</small>
        </div>
        <div id="gameControls" class="game-controls mobile-controls">
          <div class="pad movement">
            <button data-control="left" type="button" title="Move Left (A or &larr;)">
              <span class="ctrl-name">Left</span>
              <kbd class="ctrl-key">A / &larr;</kbd>
            </button>
            <button data-control="right" type="button" title="Move Right (D or &rarr;)">
              <span class="ctrl-name">Right</span>
              <kbd class="ctrl-key">D / &rarr;</kbd>
            </button>
            <button data-control="jump" type="button" title="Jump (W, Space, or &uarr;)">
              <span class="ctrl-name">Jump</span>
              <kbd class="ctrl-key">W / Space</kbd>
            </button>
          </div>
          <div class="pad combat">
            <button data-control="block" type="button" title="Block (L or Shift)">
              <span class="ctrl-name">Block</span>
              <kbd class="ctrl-key">L / Shift</kbd>
            </button>
            <button data-control="punch" type="button" title="Punch (J)">
              <span class="ctrl-name">Punch</span>
              <kbd class="ctrl-key">J</kbd>
            </button>
            <button data-control="kick" type="button" title="Kick (K)">
              <span class="ctrl-name">Kick</span>
              <kbd class="ctrl-key">K</kbd>
            </button>
          </div>
        </div>
        <div class="match-end-actions">
          <button id="rematch" class="rematch hidden">Rematch</button>
          <button id="leaveBtn" class="leave-btn hidden">Menu</button>
        </div>
      </section>
    </main>
    <script src="/client.js?v=control_keys1"></script>
  </body>
</html>
